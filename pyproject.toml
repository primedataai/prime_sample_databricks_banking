[project]
name = "prime-sample-databricks-banking"
version = "0.1.0"
description = "A starter Python package for Databricks banking data projects."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mlflow>=3.17.1",
    "pyspark>=4.2.0",
]

[project.scripts]
prime-sample-databricks-banking = "prime_sample_databricks_banking:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
